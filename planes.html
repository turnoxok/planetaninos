    u.className='stg';u.innerHTML='<div class="c c1"><img src="'+ROCK+'" alt="">Despegue</div><div class="mas" id="masP">+ '+(igual?'':'desde ')+money(dif)+'</div><div class="ics"><div class="ic" style="--i:0">'+IC.menu+'Menú</div><div class="ic" style="--i:1">'+IC.deco+'Decoración</div><div class="ic" style="--i:2">'+IC.anim+'Animación</div></div><div class="c c2"><img src="'+ROCK+'" alt="">Plus<span class="sig">+</span></div>';

  var gp=grupos.filter(function(g){return g.promo})[0],sec=$('promoSec');

    var p2=planes[Math.min(1,planes.length-1)],v2=pr(p2,gp.ref),m2=Math.max.apply(null,turnos.map(function(t){return pr(p2,t)}));
    var cuando=esc(dias(gp.dias).toLowerCase())+', '+esc(gp.turnos.map(function(t){return hh(t.inicio)+' a '+hh(t.fin)}).join(' · '))+' hs';
    sec.innerHTML='<div class="promo" aria-labelledby="pro"><span class="pill">'+esc(c.pgPromoPill||'Promo')+'</span><h2 id="pro">'+esc(c.pgPromoTitulo||'')+'</h2><p class="t">'+esc(c.pgPromoTexto||'')+' <b>Válida '+cuando+'.</b></p><div class="pgrid">'+cel+'</div>'+(m2>v2?'<p class="calc">¿Cómo se calcula el ahorro? Es el precio más alto del combo (tachado) menos el precio de la promo. Por ejemplo, '+esc(p2.nombre)+': '+money(m2)+' − '+money(v2)+' = '+money(m2-v2)+'.</p>':'')+'<a class="btn" href="./reservar/">❄️ '+esc(c.pgPromoBoton||'Reservar')+'</a><small>Con la seña te queda la fecha y el precio congelados.</small></div>';
    sec.hidden=false}else sec.hidden=true;
}
var P=window.__planes,listo=false;
